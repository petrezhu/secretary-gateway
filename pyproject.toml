[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway-interceptor"
version = "0.3.0"
description = "Universal IM message interception plugin for AI Agent harnesses — ASR/OCR enrichment + gateway daemon dispatch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Secretary Team" },
]
keywords = [
    "hermes", "agent", "plugin", "gateway", "interceptor",
    "asr", "ocr", "secretary", "im", "openclaw",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/petrezhu/secretary-gateway"
Repository = "https://github.com/petrezhu/secretary-gateway"
Issues = "https://github.com/petrezhu/secretary-gateway/issues"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
