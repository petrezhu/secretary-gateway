<svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D shadow gradient -->
    <linearGradient id="shadow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0"/>
    </linearGradient>
    <!-- Wedge face gradient -->
    <linearGradient id="wedge-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <!-- Wedge side gradient (3D depth) -->
    <linearGradient id="wedge-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6dad"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <!-- Wedge top gradient (3D depth) -->
    <linearGradient id="wedge-top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2980b9"/>
      <stop offset="100%" style="stop-color:#5dade2"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Drop shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="140" fill="none"/>

  <!-- === 3D Wedge === -->
  <!-- Shadow (ground) -->
  <polygon points="115,105 60,105 115,52" fill="#1a1a2e" opacity="0.15" transform="translate(5,5)"/>

  <!-- Right side face (3D depth) -->
  <polygon points="115,30 115,95 140,80 140,20" fill="url(#wedge-side)" opacity="0.8"/>

  <!-- Top face (3D depth) -->
  <polygon points="115,30 140,20 80,20 55,30" fill="url(#wedge-top)" opacity="0.6"/>

  <!-- Front face (main) -->
  <polygon points="55,30 115,95 115,30" fill="url(#wedge-face)" filter="url(#drop-shadow)"/>

  <!-- Edge highlight on front face -->
  <line x1="55" y1="30" x2="115" y2="95" stroke="#5dade2" stroke-width="1.5" opacity="0.6"/>
  <line x1="55" y1="30" x2="115" y2="30" stroke="#5dade2" stroke-width="1" opacity="0.4"/>

  <!-- Flow arrow: left → wedge -->
  <line x1="18" y1="62" x2="48" y2="62" stroke="#999" stroke-width="1.5" opacity="0.6"/>
  <polygon points="48,58 56,62 48,66" fill="#999" opacity="0.6"/>

  <!-- Flow arrow: wedge → right -->
  <line x1="120" y1="62" x2="155" y2="62" stroke="#27ae60" stroke-width="1.5" opacity="0.6"/>
  <polygon points="155,58 163,62 155,66" fill="#27ae60" opacity="0.6"/>

  <!-- Small dots on the wedge (texture/detail) -->
  <circle cx="80" cy="55" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="90" cy="65" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="75" cy="70" r="1" fill="#fff" opacity="0.15"/>

  <!-- === Text === -->
  <text x="170" y="52" font-family="monospace" font-size="20" fill="#ecf0f1" font-weight="bold">gateway</text>
  <text x="170" y="78" font-family="monospace" font-size="20" fill="#3498db" font-weight="bold">interceptor</text>

  <!-- Subtitle -->
  <text x="170" y="100" font-family="monospace" font-size="9" fill="#7f8c8d">ASR · OCR · FILTER · TRUNCATE</text>

  <!-- Version badge -->
  <rect x="300" y="8" width="45" height="20" rx="4" fill="#27ae60"/>
  <text x="322" y="22" font-family="monospace" font-size="9" fill="white" text-anchor="middle">v0.3</text>
</svg>
